<style>
/* Layout: one reading column, same system as the Quiz 1 and Quiz 2 drills: sticky toolbar (score + paper filter), foldable cheat sheets, then question cards. Diagram and code questions put their figure inside the card in its own horizontal scroller. */
:root {

  --surface: #FFFFFF;
  --fg: #161B24;
  --muted: #5A6375;
  --line: #D9DEE7;
  --accent: #2741C2;
  --accent-soft: #E6EAFB;
  --good: #1B7348;
  --good-soft: #E3F3EA;
  --bad: #B3261E;
  --bad-soft: #FBE6E4;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1117; --surface: #161A22; --fg: #E5E9F1; --muted: #98A1B3; --line: #2A303C;
    --accent: #8FA3FF; --accent-soft: #1E2545; --good: #5CCB91; --good-soft: #13291E;
    --bad: #FF8A80; --bad-soft: #351816; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1117; --surface: #161A22; --fg: #E5E9F1; --muted: #98A1B3; --line: #2A303C;
  --accent: #8FA3FF; --accent-soft: #1E2545; --good: #5CCB91; --good-soft: #13291E;
  --bad: #FF8A80; --bad-soft: #351816; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 80px; }
header.top { display: grid; gap: 6px; margin-bottom: 18px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 5vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.lede { color: var(--muted); margin: 0; max-width: 65ch; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; margin-bottom: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: 500 13px/1 var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 7px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip[aria-pressed="true"] .n { color: var(--surface); opacity: .8; }
.chip:focus-visible, button:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.score { font-family: var(--mono); font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; margin-right: auto; }
.score b { color: var(--fg); font-weight: 500; }

.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn:hover { border-color: var(--accent); }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
.sheet h2 { font-family: var(--display); font-size: 20px; margin: 0 0 2px; text-wrap: balance; }

.list { display: grid; gap: 14px; }

.opt { text-align: left; font: 400 15px/1.45 var(--body); background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 24px 1fr; gap: 8px; }
.opt .k { font-family: var(--mono); color: var(--muted); }

.opt.missed { border-color: var(--good); border-style: dashed; }

textarea { width: 100%; min-height: 70px; font: 400 15px/1.5 var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; resize: vertical; }

.part select, .part input { width: 100%; font: 400 14.5px/1.4 var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.part select.ok, .part input.ok { border-color: var(--good); background: var(--good-soft); }
.part select.no { border-color: var(--bad); background: var(--bad-soft); }
.part .res { grid-column: 1 / -1; font-size: 13.5px; color: var(--muted); }

.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }
.self { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.self .btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.timer { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; border: 1px solid var(--accent); border-radius: 8px; padding: 7px 10px; }

/* diagram drawing classes: every color comes from the theme tokens */

.dg .bl circle { fill: var(--accent); }
.dg .bl text { fill: var(--surface); font-family: var(--mono); font-size: 11px; font-weight: 600; }
.dg .mut { fill: var(--muted); font-size: 11.5px; }
.dg .ttl { font-family: var(--mono); font-size: 12px; fill: var(--accent); font-weight: 500; }

@media (max-width: 560px) {

<script>
/* ---------- diagram helpers (static, trusted strings) ---------- */
const DG = (function () {
  let n = 0;
  const head = id => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hd"/></marker></defs>`;
  const box = (x, y, w, h, lines, cls) => {
    const ls = [].concat(lines), cy = y + h / 2 - (ls.length - 1) * 8 + 4;
    return `<rect class="bx${cls ? " " + cls : ""}" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>` +
      ls.map((t, i) => `<text x="${x + w / 2}" y="${cy + i * 16}" text-anchor="middle">${t}</text>`).join("");
  };
  const blank = (num, x, y) => `<g class="bl"><circle cx="${x}" cy="${y}" r="9.5"/><text x="${x}" y="${y + 4}" text-anchor="middle">${num}</text></g>`;
  const path = (id, d) => `<path class="ln" d="${d}" marker-end="url(#${id})"/>`;
  const sub = (b, s) => `${b}<tspan dy="3.5" font-size="9.5">${s}</tspan>`;
  const dot = (x, y) => `<circle class="jn" cx="${x}" cy="${y}" r="2.6"/>`;
  function smwm() {
    const id = "ah" + (n++);
    return `<svg class="dg" viewBox="0 0 690 318" role="img" aria-label="SMWM training diagram with three blanks">${head(id)}
      ${box(16, 28, 64, 36, sub("o", "t+1"))}${box(104, 28, 104, 36, sub("encoder f", "θ"), "k")}${box(232, 28, 56, 36, sub("z", "t+1"))}
      ${box(16, 228, 64, 36, sub("o", "t"))}${box(104, 228, 104, 36, sub("encoder f", "θ"), "k")}${box(232, 228, 56, 36, sub("z", "t"))}
      <text class="mut" x="156" y="150" text-anchor="middle">same encoder</text>
      ${box(336, 128, 132, 36, sub("inverse model h", "ψ"))}
      ${box(336, 228, 132, 36, sub("forward model g", "φ"))}
      ${box(370, 284, 64, 26, sub("a", "t"))}
      ${box(604, 24, 76, 44, ["forward", "loss (MSE)"])}
      ${box(530, 124, 84, 44, ["inverse loss", "(MSE)"])}
      <text class="mut" x="572" y="186" text-anchor="middle">${sub("target: a", "t")}</text>
      ${path(id, "M80 46 H104")}${path(id, "M208 46 H232")}${path(id, "M288 46 H604")}
      ${path(id, "M80 246 H104")}${path(id, "M208 246 H232")}${path(id, "M288 246 H336")}
      ${path(id, "M312 46 V138 H336")}${path(id, "M312 246 V154 H336")}${dot(312, 46)}${dot(312, 246)}
      ${path(id, "M402 284 V264")}
      ${path(id, "M468 246 H642 V68")}
      ${path(id, "M468 146 H530")}
      ${blank("①", 548, 246)}${blank("②", 497, 146)}${blank("③", 470, 46)}
    </svg>`;
  }
  return { smwm };
})();

/* ---------- papers: cheat-sheet content ---------- */
const PAPERS_ALL = {
mirror: {
  id: "mirror", short: "Mirror", name: "Self-Improving Video-to-Action Models",
  meta: "arXiv 2610.24177 · Ryu, Chen, Wilcoxson, Sitzmann · MIT CSAIL · 2026",
  gist: "视频模型可以当视觉规划器（VP）：给定历史帧和任务，生成「接下来该怎么做」的视频。把视频翻译成动作要靠 video-to-action（V2A，也叫逆动力学）模型，以往它需要大量人工采集的视频-动作配对数据。Mirror 让一个随机初始化的 V2A 模型对着专家级 VP 自我提升：VP 出计划 → V2A 猜动作（加探索噪声）→ 在环境里执行 → 用「实际执行的动作 + 实际到达的下一帧」训练 V2A。不需要专家动作标签、奖励、特权状态、verifier 或轨迹筛选。",
  facts: [
    "策略分两步采样：ô_{t+1} ∼ p_VP(· | o_≤t, l_task)，再 a_t ∼ p_V2A(· | o_≤t, ô_{t+1})。",
    "式 (1) 两种分解：VP（action-free）× V2A（task-agnostic），对比 WM（action-bound）× policy（task-specific）。VP 从无动作的海量视频里同时学「做什么」（程序性知识）和「世界怎么响应」（物理知识）；留给 V2A 的只是一个与任务无关的「转移 → 动作」映射。",
    "Alg. 1：采集时执行 a_t = V2A 的预测 + 噪声 n_t ∼ π_explore，把 (o_≤t, a_t, o_{t+1}) 存进 replay buffer；训练时最大化 log p_V2A(a_t | o_≤t, o_{t+1})。条件是实际到达的 o_{t+1}，不是计划的 ô_{t+1}，所以偏离计划的转移也是合法样本。",
    "每个计划都以智能体真实观测到的帧为条件，从不以之前的计划为条件 → 偏离可以被纠正，误差不累积，不需要对付 exposure bias 的 anti-drift 技巧。",
    "噪声的两个作用：(a) 只用自己 rollout 的数据训练，V2A 会塌成不管观测都输出同一个动作；(b) 把智能体带过还不会的里程碑：VP 不断重规划、反复提出同一个转移，随机动作迟早采到正确的那个，进入 buffer 后被学会。确定性的智能体会被卡死（Fig. 2）。",
    "为什么比随机探索强：数据集中在「当前能力的前沿」；随机策略得先碰巧走完里程碑之前的整串动作，才有机会试那个关键动作（Fig. 1）。",
    "VP：14B 的 Cosmos3-Nano（文本塔冻结，只微调视频塔）。Block-causal + KV cache：每个观测帧只编码一次，计划对着缓存双向去噪；滑动窗口注意力让每次规划成本恒定，32 s 片段上训练的规划器能跑 5 分钟以上的上下文。Task-aware guidance：用无任务条件的规划器去引导有任务条件的规划器，提高任务依从性。",
    "Minecraft：VP 在 2,946 小时 VPT 视频上预训练；动作空间是 MineRL 1.0（20 Hz，20 个键 4000+ 种组合 + 连续鼠标），不简化。",
    "BASALT（目标模糊、难验证）：V2A 从零自我对弈 5 小时（36 万步），FindCave 82%、MakeWaterfall 36%（用动作标签的版本是 91% / 45%）。第一个不靠分类器或写死动作、在 MakeWaterfall 上非零的方法。CreateAnimalPen、BuildVillageHouse 所有学习方法都是 0。",
    "钻石挑战，离线设定（VP + 用 3k 小时 VPT 动作监督训练的 V2A，没有环境交互）：钻石 5.5%，Dreamer 4 是 0.7%，近 8 倍。",
    "钻石挑战，在线自我提升（无动作标签、无奖励），140 小时（约 1000 万步）：石镐 72.7%、铁镐 15.6%（Dreamer V3 同预算铁镐 1.7%）。还拿不到钻石。",
    "子目标：启发式任务规划器根据背包、血量、是否打开 GUI 选文本提示，只给 VP；V2A 从不知道子目标。Dreamer 4 则是给 policy 喂 one-hot 任务嵌入。",
    "Oracle VP（专家策略 + 同步的环境副本渲染出「计划」帧，专家动作不给 V2A 看）：约 80 小时第一次拿到钻石 → 剩下的瓶颈是 VP 的能力，不是自我提升算法。",
    "涌现能力：保留死亡之间的视频历史，逃出岩浆湖的成功率上升（in-context learning from failure；每条命重置历史只有 3%）。文本零样本操控 10 个任务：自我提升 V2A 64%，监督 V2A 71%，随机游走 V2A 42%。",
    "24 个 RL 任务（13 DMC + 4 OGBench + 7 Atari，1M 步）：生成式 VP 下 Atari 62% expert、OGBench 0.92；oracle VP 下 Atari 99%。基线：BCO（自己 rollout 学 V2A 再去克隆，没有 VP 引导采集）、Grounding（Luo & Du：学目标条件策略去够视频预测的子目标）、VIPER（视频似然当奖励）、LAIfO（对抗匹配）。",
    "Assault、Zaxxon 上超过专家 10%、25%：专家有多余的开火指令（画面上没产生新子弹），V2A 只需复现画面变化，不必照抄。",
    "局限：小时级任务要靠外部子目标规划器；纯自我提升还到不了钻石（不完美的 V2A 把智能体带到人类很少去的状态，VP 泛化不够）；有些动作在画面上不留痕迹，纯视觉从零推断是不适定的；训练鲁棒的 VP 很吃数据（专家策略的数据缺少多样性，要用 DAgger 补恢复样本）。"
  ]
},
smwm: {
  id: "smwm", short: "SMWM", name: "Sensorimotor World Models: Perception for Action via Inverse Dynamics",
  meta: "arXiv 2606.20104 · Ivashkov, Balestriero, Schölkopf · MPI-IS Tübingen / Brown · 2026",
  gist: "JEPA 式潜空间世界模型在嵌入空间里预测下一状态，编码器和预测器端到端一起训练时，编码器会塌缩成常数。SMWM 只加一个正则：逆动力学头从 (z_t, z_{t+1}) 预测动作 a_t，梯度传回编码器，L = L_fwd + λ·L_inv。这一个正则同时做两件事：防塌缩，并让表征对齐「可控自由度」、丢掉不可控的干扰物（perception for action）。不用冻结编码器、EMA、stop-gradient，也不给嵌入分布加先验。",
  facts: [
    "三个模块：编码器 f_θ：o → z；前向模型 g_φ(z_t, a_t) → ẑ_{t+1}；逆模型 h_ψ(z_t, z_{t+1}) → â_t。两个损失都是 MSE。前向损失更新 f 和 g，逆损失更新 f 和 h，编码器吃两路梯度。",
    "只有 L_fwd 时的平凡解：f 把所有观测映到常数 z*，g 也输出 z*，损失为 0。",

{ p: "mirror", core: true, type: "sa", q: "What does Mirror assume access to, and what does it NOT need?",
  a: "It assumes an expert-level video planner (pre-trained on action-free video) and the ability to interact with the environment. It needs no expert action labels and no hand-crafted rewards, and also no privileged state, verifier or trajectory filtering.",
  why: "一句话：把赌注押在视频模型会继续变强上，规划器的能力不靠额外的专家动作数据就能翻译成动作。", ref: "§1" },
{ p: "mirror", core: true, type: "sa", q: "Why can the V2A model be trained on the agent's own, initially poor, rollouts while a task policy could not?",
  a: "The V2A model only maps an observed transition (o_≤t, o_{t+1}) to the action that caused it; it is task-agnostic. Whatever the agent did, the executed action is a correct label for the transition it produced, so even failed attempts are valid examples. The task knowledge stays in the planner, which steers which transitions get collected.",
  why: "关键词：task-agnostic；用实际到达的 o_{t+1} 做条件；VP 负责「做什么」。", ref: "§3, §3.1" },
{ p: "mirror", core: true, type: "sa", q: "Explain how re-planning and exploration noise together get the agent past a milestone it has never achieved.",
  a: "When the V2A model outputs the wrong action, the planned transition does not happen; the planner re-plans from the real state and proposes the same transition again, holding the agent at the milestone. Noise eventually samples the correct action, that transition enters the replay buffer, the V2A model learns it, and later episodes pass the milestone.",
  why: "对比随机探索：它得先碰巧走完到里程碑之前的整串动作。", ref: "§3.1, Fig. 1–2" },
{ p: "mirror", type: "sa", q: "Name two limitations the authors acknowledge.",

  why: "第 3 条和 SMWM 的局限是同一个问题：逆动力学只能恢复看得见后果的动作。", ref: "§5" },

{ p: "smwm", core: true, type: "sa", q: "Why does a JEPA-style latent world model collapse when trained with the forward prediction loss alone? How does the inverse dynamics loss prevent it?",
  a: "The prediction and its target both come from the same encoder, so mapping every observation to one constant makes the forward loss zero. The inverse head must predict the action from (z_t, z_{t+1}); with constant embeddings it can only output the mean action, so lowering the inverse loss forces the embeddings to keep action-relevant information.",
  why: "两句话：平凡解是什么；为什么逆损失在平凡解上降不下去。", ref: "§3" },
{ p: "smwm", core: true, type: "sa", q: "What does an SMWM representation keep and what does it discard? Why?",
  a: "It keeps the controllable degrees of freedom (what the agent's actions change) and discards uncontrollable distractors. A distractor is independent of the action, so it does not help the inverse loss, and it evolves unpredictably, so encoding it would only increase the forward loss.",
  why: "这就是标题里的 perception for action：表征长什么样取决于智能体能做什么。", ref: "§4, Fig. 4" },
{ p: "smwm", type: "sa", q: "In the dot world the forward model behaves like g_a(z) ≈ z + ρ(a). Why might the inverse loss favor this translation-like solution?",
  a: "A simple way to make the action recoverable from (z_t, z_{t+1}) is to encode it in the displacement z_{t+1} − z_t ≈ ρ(a_t); if ρ is injective, the inverse head just inverts it. Nothing enforces additivity, but it is a low-complexity solution.",
  why: "这是作者给的「可能的解释」，不是定理。", ref: "§4, Eq. 7" },
{ p: "smwm", type: "sa", q: "State one limitation of using single-step inverse dynamics as the regularizer.",
  a: "Any one: actions must be recoverable from two consecutive frames (fails when distinct actions cause the same visible change); a single-frame encoder cannot capture velocities; the action-aligned bias may discard information a downstream task needs; a biased behavior policy can create action-correlated but uncontrollable distractors that get encoded.",
  why: "作者把「丢掉与动作无关的信息」称为 feature rather than a bug。", ref: "§6" },

{ p: "dreamer4", core: true, type: "mc", q: "Shortcut forcing combines which two ideas?",
  opts: ["Diffusion forcing (a separate signal level per time step) and shortcut models (step-size conditioning with a bootstrap loss)", "Teacher forcing (clean history at every time step) and consistency distillation from a pretrained multi-step teacher model", "Diffusion forcing (a separate signal level per time step) and masked autoencoding of the tokenizer's latent tokens", "Full-sequence diffusion (one signal level for the whole clip) and classifier-free guidance on the action inputs"],

{ p: "dreamer4", type: "mc", q: "In a shortcut model, how is the network trained for step sizes larger than the finest step d_min?",

{ p: "dreamer4", core: true, type: "mc", q: "At inference, Dreamer 4 slightly corrupts the past frames it conditions on (τ_ctx = 0.1). Why?",

{ p: "dreamer4", core: true, type: "sa", q: "Why can video world models accumulate errors in long autoregressive rollouts? Name two things Dreamer 4 does about it.",
  a: "Each generated frame becomes context for the next, so small errors move the model away from the data it was trained on and build up. Dreamer 4 (1) predicts clean latents (x-prediction, x-space loss) instead of high-frequency velocities, and (2) trains with a separate noise level per frame and lightly noises its context at inference, so it tolerates imperfect history.",
  why: "这道题就是 Quiz 2 第 9 题的续集。", ref: "§3.2, §4.4" },
{ p: "dreamer4", core: true, type: "sa", q: "What is imagination training? Why does Dreamer 4 count as an offline method even though it runs on-policy reinforcement learning?",
  a: "The policy is trained by reinforcement learning on rollouts generated by the world model: latents come from the dynamics, actions from the policy head, rewards and values from learned heads. The world model is learned from a fixed dataset and the agent never interacts with the real environment during learning.",
  why: "离线很重要的原因：真实机器人上部署没训好的策略不安全，重置场景和实时给奖励也难。", ref: "§3.3, §4.1" },
{ p: "dreamer4", core: true, type: "sa", q: "Why must other tokens be prevented from attending to the agent (task) tokens?",
  a: "Otherwise the world model's predictions could depend on the task, for example predicting success because the task asks for it (causal confusion). With one-way attention, future predictions can be directly influenced only by actions, so the model stays a faithful simulator whatever the policy does.",
  why: "agent token 能看所有模态；没有别的模态能回看它。", ref: "§3.3" },
{ p: "dreamer4", type: "sa", q: "What does imagination training add on top of behavior cloning, according to the experiments?",
  a: "Behavior cloning can only reproduce strategies in the dataset. RL inside the world model maximizes the learned reward, so the policy improves beyond the demonstrations: success rates rise most on the hardest milestones (iron pickaxe, diamonds) and the agent reaches milestones faster.",
  why: "Fig. 4：WM+BC → Dreamer 4。即使不做想象训练，世界模型的表征也比 Gemma 3 更适合 BC。", ref: "§4.1, Fig. 3–4" },

{ p: "flowm", core: true, type: "mc", q: "Informally, what does flow equivariance require of a sequence model?",
  opts: ["If the input sequence is transformed by a time-parameterized flow, the output sequence transforms by the same flow", "If the input sequence is transformed by a time-parameterized flow, the output sequence stays exactly as it was", "The output at time t depends only on inputs up to time t, so the model can be rolled out one frame at a time", "The model outputs the optical flow between consecutive input frames and warps the previous output with it"],
  a: 0, why: "第二个是不变性。式 (1)：Φ({ψ_t·f_t})_T = ψ_T·Φ({f_t})_T。普通等变是 ϕ(g·f) = g·ϕ(f)，流等变把固定的 g 换成随时间走的 ψ_t(ν)。", ref: "§3.1, Eq. 1" },
{ p: "flowm", core: true, type: "mc", q: "Under partial observability, FloWM asks for equivariance to flows of the unobserved world state, not of the observations. What does this imply for the hidden state?",
  opts: ["It must act as a structured memory map of the environment that transforms the same way whether an object is in view or not", "It only needs to encode the current observation, since out-of-view content can be re-generated when it comes back into view", "It must store all past frames in compressed form, so that attention can retrieve the relevant ones when the agent looks back", "It must be invariant to the agent's viewpoint, and therefore has to discard information about where objects are located"],
  a: 0, why: "O(ψ_t·w_t) ≠ ψ_t·f_t：身后驶来的车暂时不改变你看到的画面，但几秒后会从你身边开过。", ref: "§3.1, Eq. 2" },
{ p: "flowm", core: true, type: "mc", q: "What are FloWM's velocity channels?",
  opts: ["Copies of the hidden state, each transported at every step by its own velocity ν, so content moving at that velocity stays aligned", "Extra input channels that hold the optical flow estimated between consecutive frames and are concatenated to the image", "Output heads that regress the velocity of every object in the scene and are supervised with an additional tracking loss", "Learned embeddings of the agent's action, one per possible action, that are concatenated to the hidden state at each step"],
  a: 0, why: "隐状态定义在 V × G 上。MNIST World |V| = 25（速度 ±2），3D |V| = 5。读出时对通道 max-pool。它们负责外部物体的运动。", ref: "§3.1, Eq. 3, App. G.2, H.2" },
{ p: "flowm", core: true, type: "mc", q: "How does FloWM achieve self-motion equivariance?",
  opts: ["At each step it transforms the memory by the inverse of the known action, so the memory lives in the agent's co-moving frame", "It adds one extra velocity channel for every possible action of the agent and lets the decoder pick the matching channel", "It embeds the action as a token and lets self-attention learn how each action changes the scene, as video diffusion models do", "It estimates the agent's motion from optical flow between frames and subtracts it from the image before encoding"],
  a: 0, why: "运动是相对的：自身运动等价于输入的整体运动。动作已知，所以不需要增加速度通道（式 7）。第三个是基线的做法；把动作拼进输入的消融（action-concat）也失败了。", ref: "§3.1, Eq. 7" },
{ p: "flowm", type: "mc", q: "In the Simple Recurrent FloWM, h_{t+1}(ν) = ψ_1(ν − a_t) · σ(W ⋆ h_t(ν) + pad(U ⋆ f_t)). What does pad(·) model?",
  opts: ["Partial observability: the encoded observation is written only into the field-of-view window of a hidden state larger than the view", "Boundary handling: the image is zero-padded so that convolutions at the edge of the field of view do not shrink the feature map", "Channel selection: velocity channels whose velocity does not match the observed motion are filled with zeros before the update", "Causality: future frames are masked out so that the recurrence at step t cannot access observations from later time steps"],
  a: 0, why: "世界比视野大；窗口之外的隐状态绕着视野流动。读出：f̂_{t+1} = g_θ(max_ν window(h_{t+1}))。", ref: "§3.2, Eq. 8, Fig. 3" },

  opts: ["It is not built in: the encoder is treated as if equivariant, and the equivariant memory transform between steps encourages it to learn this", "By explicit depth unprojection of every pixel into a 3D voxel grid, which is then flattened along the vertical axis into a top-down map", "By group-convolution layers in the encoder that are exactly equivariant to the agent's translations and 90-degree rotations", "By an auxiliary loss that measures the equivariance error with a position probe and penalizes it during world-model training"],

<script>
(function () {

    const left = Math.max(0, Math.round((timerEnd - Date.now()) / 1000));
    t.hidden = false;
    t.textContent = left > 0 ? `Time left ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}` : "Time is up";
    t.className = "timer" + (left === 0 ? " over" : left <= 60 ? " low" : "");
    if (left === 0 && timerId) { clearInterval(timerId); timerId = null; }
  }

  function render() {
    renderFilters(); renderScore(); renderSheets(); tick();
    const list = document.getElementById("list"); list.replaceChildren();
    const vs = visible();
    if (!vs.length) list.append(el("p", { class: "empty", text: "No questions here." }));
    vs.forEach((q, i) => list.append(card(q, i)));
  }

  function clearQ(id) { delete state.mc[id]; delete state.multi[id]; delete state.parts[id]; delete state.sa[id]; delete state.draft[id]; }
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  document.getElementById("btnSheet").addEventListener("click", () => { sheetOpen = !sheetOpen; renderSheets(); });
  document.getElementById("btnMock").addEventListener("click", () => {
    // Quiz-shaped: per paper one auto-graded and one written core-idea item, then two cross-paper items. 10 questions, 10 minutes.
    const ids = [];
    ["mirror", "smwm", "dreamer4", "flowm", "cross"].forEach(k => {
      const qs = QS.filter(q => q.p === k && q.core);
      ids.push(pick(qs.filter(isAuto)).id, pick(qs.filter(q => !isAuto(q))).id);
    });
    mock = ids; ids.forEach(clearQ);
    timerEnd = Date.now() + 10 * 60 * 1000;
    if (timerId) clearInterval(timerId);
    timerId = setInterval(tick, 1000);
    save(); render(); window.scrollTo({ top: 0 });
  });
  document.getElementById("btnReset").addEventListener("click", () => { visible().forEach(q => clearQ(q.id)); save(); render(); });
  document.getElementById("foot").textContent = FOOT;
  render();
})();
</script>
